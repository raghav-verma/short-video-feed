include: package:flutter_lints/flutter.yaml

formatter:
  page_width: 100

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  exclude:
    - lib/**/*.g.dart
    - lib/l10n/generated/**
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    - prefer_single_quotes
    - unawaited_futures
    - avoid_print
    - prefer_final_locals
    - require_trailing_commas
